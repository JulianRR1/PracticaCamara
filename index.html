<style>
      /* --- Reseteo Básico y Globales --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        line-height: 1.6;
      }

      /* --- Contenedor Principal (App) --- */
      main {
        max-width: 600px;
        margin: 0 auto;
        padding: 1.5rem;
        background-color: #ffffff;
        min-height: 100vh;
      }

      h1,
      h2 {
        text-align: center;
        color: #222;
        margin-bottom: 1.5rem;
      }

      h2 {
        font-size: 1.5rem;
        border-top: 1px solid #eee;
        padding-top: 1.5rem;
      }

      /* --- Estilo de Botones --- */
      button {
        display: block;
        width: 100%;
        padding: 0.8rem 1rem;
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff;
        background-color: #007bff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }

      button:hover {
        background-color: #0056b3;
      }

      button:active {
        transform: scale(0.98);
      }

      /* --- Contenedor de la Cámara --- */
      #cameraContainer {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      #video {
        width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      /* Botón de tomar foto */
      #takePhoto {
        background-color: #dc3545;
      }
      #takePhoto:hover {
        background-color: #c82333;
      }

      /* Canvas oculto */
      #canvas {
        display: none;
      }

      /* --- Galería / Carrusel --- */
      #galleryContainer {
        display: flex;
        overflow-x: auto;
        background-color: #e9ecef;
        padding: 1rem;
        margin-top: 1rem;
        border-radius: 8px;
        min-height: 130px;
        align-items: center;

        scrollbar-width: thin;
        scrollbar-color: #007bff #e9ecef;
      }

      #galleryContainer:empty::before {
        content: "Aún no has tomado fotos.";
        color: #888;
        width: 100%;
        text-align: center;
        font-style: italic;
      }

      /* ===== AQUÍ ESTÁ EL CAMBIO ===== */
      .carousel-item {
        width: 120px;
        height: 90px;
        
        /* 1. La propiedad clave: "contain" */
        object-fit: contain; /* Mantiene el aspecto, no recorta */

        /* 2. Fondo para el letterboxing */
        background-color: #000; /* Fondo negro para los espacios vacíos */
        
        /* 3. Ajustes estéticos */
        margin-right: 10px;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15); /* La sombra ya da separación */
        flex-shrink: 0;
        transition: transform 0.2s ease;
      }
      /* ===== FIN DEL CAMBIO ===== */

      .carousel-item:hover {
        transform: scale(1.05);
      }
    </style>
    ```

Ahora, sin importar si la foto es vertical (9:16) u horizontal (16:9), se verá completa dentro de la miniatura de 120x90px, con un fondo negro que rellena el espacio sobrante.
